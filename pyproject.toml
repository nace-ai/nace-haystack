[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "nace-haystack"
dynamic = ["version"]
description = "Haystack integration for Drex decision models by Nace"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
keywords = ["Haystack", "Drex", "Nace", "classification", "decision model", "routing", "evaluation"]
authors = [{ name = "Nace AI", email = "hello@nace.ai" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = ["haystack-ai>=3.0.0", "nace-sdk>=0.3.0,<1.0.0", "httpx>=0.27,<1.0", "filetype>=1.0.0", "pydantic>=2.0"]

[project.urls]
Documentation = "https://console.nace.ai/docs"
Issues = "https://github.com/nace-ai/nace-haystack/issues"
Source = "https://github.com/nace-ai/nace-haystack"

# The source distribution goes to PyPI too: ship the package, its tests and the top-level docs only, never internal
# notes, examples or CI files
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE.txt", "/CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/haystack_integrations"]

[tool.hatch.version]
source = "vcs"
tag-pattern = 'v(?P<version>.*)'

[tool.hatch.envs.default]
installer = "uv"
dependencies = ["haystack-pydoc-tools", "ruff"]

[tool.hatch.envs.default.scripts]
docs = ["haystack-pydoc pydoc/config_docusaurus.yml"]
fmt = "ruff check --fix {args}; ruff format {args}"
fmt-check = "ruff check {args} && ruff format --check {args}"

[tool.hatch.envs.test]
dependencies = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-rerunfailures",
    "mypy",
    "pip",
    # Shrinking big images needs Pillow; at runtime it is a lazy import, as in Haystack's image converters
    "pillow",
    # The packaging tests ask hatchling which files a build would ship
    "hatchling",
]

[tool.hatch.envs.test.scripts]
unit = 'pytest -m "not integration" {args:tests}'
integration = 'pytest -m "integration" {args:tests}'
all = 'pytest {args:tests}'
unit-cov-retry = 'pytest --cov=haystack_integrations --reruns 3 --reruns-delay 30 -x -m "not integration" {args:tests}'
integration-cov-append-retry = 'pytest --cov=haystack_integrations --cov-append --reruns 3 --reruns-delay 30 -x -m "integration" {args:tests}'
types = """mypy -p haystack_integrations.common.nace \
-p haystack_integrations.components.routers.nace \
-p haystack_integrations.components.classifiers.nace \
-p haystack_integrations.components.evaluators.nace {args}"""

[tool.mypy]
install_types = true
non_interactive = true
check_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
# filetype (used by Haystack itself to sniff image types) ships no type information
module = ["filetype"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
# The plan and spec under docs/ hold illustrative code blocks, not package code
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "C",
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D205",   # 1 blank line required between summary line and description
    "D209",   # Closing triple quotes go to new line
    "D213",   # summary lines must be positioned on the second physical line of the docstring
    "D417",   # Missing argument descriptions in the docstring
    "D419",   # Docstring is empty
    "DTZ",
    "E",
    "EM",
    "F",
    "I",
    "ICN",
    "ISC",
    "N",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "Q",
    "RUF",
    "S",
    "T",
    "TID",
    "UP",
    "W",
    "YTT",
]
ignore = [
    # Allow non-abstract empty methods in abstract base classes
    "B027",
    # Allow function calls in argument defaults (common Haystack pattern for Secret.from_env_var)
    "B008",
    # Ignore checks for possible passwords
    "S105",
    "S106",
    "S107",
    # Ignore complexity
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    # Allow `Any` type - used legitimately for dynamic types and SDK boundaries
    "ANN401",
]

[tool.ruff.lint.isort]
known-first-party = ["haystack_integrations"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, relative imports, and don't need type annotations
"tests/**/*" = ["PLR2004", "S101", "TID252", "D", "ANN"]
# Examples print to the console and draw synthetic data from a seeded random generator
"examples/**/*" = ["T201", "D", "ANN", "S311"]
# The cookbook notebook prints and displays results for the reader
"notebooks/**/*" = ["T201", "T203", "D", "ANN", "A004"]

[tool.coverage.run]
source = ["haystack_integrations"]
branch = true
parallel = false
relative_files = true

[tool.coverage.report]
omit = ["*/tests/*", "*/__init__.py"]
show_missing = true
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
  "integration: integration tests",
]
log_cli = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
